name: Overlay CI

on:
  pull_request:
    paths:
      - "overlay/**"
      - ".github/workflows/overlay-*.yml"
  push:
    branches:
      - main
    paths:
      - "overlay/**"
      - ".github/workflows/overlay-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, line limits, typecheck, build and unit tests
        run: npm run verify
