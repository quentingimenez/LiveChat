name: rust

# CI du rebuild Rust (serveur + overlay). Remplace à terme server.yml et overlay-ci.yml.
on:
  push:
    branches: [feat/rust-rebuild, main]
    paths:
      - "crates/**"
      - "apps/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest
        # --no-tests=pass : le squelette Phase 0 n'a pas encore de tests ; on ne
        # veut pas que la CI échoue sur « no tests to run » avant la Phase 1.
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast --no-tests=pass
      # nextest n'exécute pas les doctests : étape séparée.
      - name: doctests
        run: cargo test --workspace --doc --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: audit (non bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tant que la toolchain n'est pas complète et que le graphe de dépendances
    # grandit vite, l'audit informe sans bloquer la CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
