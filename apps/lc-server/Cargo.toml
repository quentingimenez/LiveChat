[package]
name = "lc-server"
description = "Bibliothèque et binaire du serveur LiveChat : API REST, WebSocket v2 et workers de lecture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
lc-db = { workspace = true }
lc-discord = { workspace = true, features = ["serenity"] }
lc-domain = { workspace = true }
lc-media = { workspace = true }
lc-playback = { workspace = true }
lc-protocol = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serenity = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
    "compression-gzip",
    "cors",
    "fs",
    "request-id",
    "trace",
] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = "0.29"

[lints]
workspace = true
