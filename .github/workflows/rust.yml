name: rust

# CI gate of the Rust workspace (lc-server, lc-overlay, crates, xtask).
#
# Politique :
# - actions tierces épinglées par commit SHA (audit A7-003) ;
# - `cargo deny check` bloquant (politique centralisée dans deny.toml) ;
# - `cargo audit` bloquant : les exceptions sont exactement celles documentées
#   dans deny.toml ([advisories].ignore) et reportées en CLI `--ignore` car
#   cargo-audit ne lit pas deny.toml. Tenir les deux listes synchronisées.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "tools/bombadil/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - ".github/workflows/rust.yml"
      - "deploy/server.Dockerfile"
      - "deploy/server.Dockerfile.dockerignore"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "tools/bombadil/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - ".github/workflows/rust.yml"
      - "deploy/server.Dockerfile"
      - "deploy/server.Dockerfile.dockerignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Les deps du workspace varient entre Linux et Windows : le cache est clé par OS.
  CARGO_INCREMENTAL: "0"
  # lc-server's build.rs builds the admin console with npm; CI jobs that need
  # the embedded console build it themselves in an explicit step.
  LC_ADMIN_WEB_BUILD: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # The admin console is embedded in the server binary by `rust-embed`; this
  # job builds and tests the Preact/TypeScript front on its own.
  admin-web:
    name: admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/lc-admin-web/package-lock.json
      - name: npm ci
        working-directory: apps/lc-admin-web
        run: npm ci
      - name: npm run typecheck
        working-directory: apps/lc-admin-web
        run: npm run typecheck
      - name: npm test
        working-directory: apps/lc-admin-web
        run: npm test
      - name: npm run build
        working-directory: apps/lc-admin-web
        run: npm run build

  # AUD-COR-18/A7-012 : `rust-version` est déclaré à 1.85 mais les dépendances
  # Tauri 2 du workspace exigent davantage (tauri-utils 2.10.2 / tray-icon 0.25.1
  # → 1.90, time 0.3.55 → 1.88, uuid 1.29.2 → 1.89). 1.85 est donc irréalisable
  # sans downgrade massif du lock ; ce job vérifie la MSRV réelle du workspace.
  # Proposition (Lead) : passer `rust-version` et `clippy.toml:msrv` à 1.90.
  msrv:
    name: msrv (1.90)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90.0"
      # libwebkit2gtk/gtk : requis pour compiler apps/lc-overlay (Tauri 2) sur Linux.
      - name: Linux system dependencies (Tauri)
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain (clippy)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # libwebkit2gtk/gtk : requis pour compiler apps/lc-overlay (Tauri 2) sur Linux.
      # libssl-dev + pkg-config : backend TLS native-tls de l'overlay.
      - name: Linux system dependencies (Tauri)
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `rust-embed` embeds apps/lc-admin-web/dist at compile time: build it
      # before cargo so the embedded-assets tests see real files.
      - name: Node 24 (embedded admin assets)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/lc-admin-web/package-lock.json
      - name: Build the admin console for the embed tests
        working-directory: apps/lc-admin-web
        run: |
          npm ci
          npm run build
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: nextest
      - name: cargo nextest
        # Pas de `--no-tests=pass` : le workspace couvre désormais crates/ et apps/,
        # un run vide serait une régression de configuration à signaler.
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast
      # nextest n'exécute pas les doctests : étape séparée.
      - name: doctests
        run: cargo test --workspace --doc --locked
      # End-to-end tests of the admin console: Chromium against the real
      # lc-server binary (fresh database, see apps/lc-admin-web/e2e/server.mjs).
      - name: Build lc-server for the console E2E
        if: runner.os == 'Linux'
        run: cargo build -p lc-server --bin lc-server --locked
      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        working-directory: apps/lc-admin-web
        run: npx playwright install --with-deps chromium
      - name: Admin console E2E
        if: runner.os == 'Linux'
        working-directory: apps/lc-admin-web
        env:
          LC_SERVER_BIN: ${{ github.workspace }}/target/debug/lc-server
        run: npm run e2e
      # Property-based exploration with Bombadil (tools/bombadil): random
      # clicks, typing and navigation on the admin console (real lc-server)
      # and on the overlay board (Tauri shell mock), checking for JS errors,
      # HTTP errors and leaked `undefined`/`NaN` on screen. Not blocking yet:
      # a violation shows as a failed step and its trace is uploaded.
      # Bombadil drives the runner's preinstalled Google Chrome.
      - name: Bombadil dependencies
        if: runner.os == 'Linux'
        working-directory: tools/bombadil
        run: |
          npm ci
          npm run typecheck
      - name: Bombadil — admin console
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: tools/bombadil
        env:
          LC_SERVER_BIN: ${{ github.workspace }}/target/debug/lc-server
          BOMBADIL_TIME_LIMIT: 3m
          BOMBADIL_NO_SANDBOX: "1"
        run: npm run admin
      - name: Bombadil — overlay board
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: tools/bombadil
        env:
          BOMBADIL_TIME_LIMIT: 3m
          BOMBADIL_NO_SANDBOX: "1"
        run: npm run board
      - name: Upload the Bombadil traces
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bombadil-traces
          path: tools/bombadil/out/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the production image on every change (without publishing it) so a
  # broken Dockerfile shows up before the release tag, then checks that the
  # container serves the embedded admin console and accepts a login.
  image:
    name: image (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/server.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: livechat-server:ci
          cache-from: type=gha,scope=server-image-ci
          cache-to: type=gha,scope=server-image-ci,mode=max
      - name: Run the container
        run: |
          set -euo pipefail
          docker run --detach --name lc-server-ci \
            --publish 127.0.0.1:3000:3000 \
            --env API_URL=http://127.0.0.1:3000 \
            --env ADMIN_UI_TOKEN=ci-admin-secret \
            livechat-server:ci
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/health > /tmp/health.json 2>/dev/null; then
              cat /tmp/health.json; echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not answer within 60 s"
          exit 1
      - name: The embedded console and its assets are served
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          curl -fsS --max-time 5 "$base/admin/" > /tmp/admin.html
          grep -q 'Administration du serveur</title>' /tmp/admin.html
          assets="$(grep -oE '/admin/assets/[^"]+\.(js|css)' /tmp/admin.html | sort -u)"
          test -n "$assets"
          for asset in $assets; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$base$asset")"
            echo "GET $asset -> $status"
            test "$status" = "200"
          done
      - name: A secret login opens a session that reaches the API
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          # The session cookie is sent back by hand: it may carry `Secure`,
          # which curl's cookie jar would not replay over plain http.
          cookie="$(curl -sS -D - -o /dev/null --max-time 5 \
            -H "Origin: $base" -H 'Content-Type: application/json' \
            --data '{"secret":"ci-admin-secret"}' "$base/admin/auth/secret" \
            | grep -i '^set-cookie: lc_admin_session=' \
            | sed -E 's/^[^:]+: ([^;]+).*/\1/' | tr -d '\r')"
          test -n "$cookie"
          status="$(curl -sS -o /tmp/overview.json -w '%{http_code}' --max-time 5 \
            -H "Cookie: $cookie" "$base/admin/api/overview")"
          echo "GET /admin/api/overview -> $status"
          test "$status" = "200"
          anonymous="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$base/admin/api/overview")"
          echo "without session -> $anonymous"
          test "$anonymous" = "401"
      - name: Container logs
        if: always()
        run: docker logs lc-server-ci || true

  deny:
    name: deny (bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Sortie non nulle = job rouge (advisories/licences/bans/sources).
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  audit:
    name: audit (bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit
      # Exceptions = copie exacte de deny.toml [advisories].ignore (audit A7-002).
      # Toute nouvelle alerte fait échouer le job ; toute exception retirée de
      # deny.toml doit être retirée ici.
      - name: cargo audit
        run: |
          set -euo pipefail
          # RUSTSEC-2023-0071 (rsa 0.9.10) : crate présent uniquement dans
          # Cargo.lock via sqlx-mysql (dépendance optionnelle jamais résolue :
          # `cargo tree -i rsa` = vide, aucun binaire ne l'embarque). cargo-deny
          # raisonne sur le graphe résolu et ne le voit pas ; cargo-audit scanne
          # tout le lockfile, d'où cette exception locale au workflow.
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0346 \
            --ignore RUSTSEC-2026-0349 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0382 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372
