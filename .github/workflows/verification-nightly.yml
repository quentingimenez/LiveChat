name: verification-nightly

# `schedule` and `workflow_dispatch` only take effect once this file is on the
# default branch; the `pull_request` trigger runs it on the PR meanwhile.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      network_tests:
        description: "Also run the ignored tests that need external network or credentials (tikwm/TikTok, X, Tenor, Giphy, Imgur, YouTube, Dailymotion, Brave, Discord gateway): they fail when a third party is down."
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/verification-nightly.yml"
      - "fuzz/**"
      - "scripts/mutants-baseline.json"

permissions:
  contents: read

concurrency:
  group: verification-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [protocol_frame, media_url, html_parsers]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # lc-media depends on parley (Cargo.toml) whose yeslogic-fontconfig-sys
      # build script needs the system fontconfig headers on Linux; the fuzz
      # targets link lc-media.
      - name: Install Linux fontconfig
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "fuzz -> target"
      # Fallback if the tool is unknown to taiki-e: cargo install cargo-fuzz --locked
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz
      # fuzz/ is its own workspace excluded from the root one: no other
      # job runs the seed and golden tests in fuzz/src/lib.rs, so they run
      # here before any fuzzing. They read the repo fixtures directly
      # (CARGO_MANIFEST_DIR), so one matrix leg is enough.
      - name: Run the fuzz seed and golden tests
        if: matrix.target == 'protocol_frame'
        run: cargo test --manifest-path fuzz/Cargo.toml --no-default-features --lib --locked
      - name: Seed the fuzz corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}/
          if [ "${{ matrix.target }}" = "protocol_frame" ]; then
            cp crates/lc-protocol/tests/fixtures/* fuzz/corpus/protocol_frame/
          elif [ "${{ matrix.target }}" = "html_parsers" ]; then
            cp crates/lc-media/tests/fixtures/* fuzz/corpus/html_parsers/
          else
            printf '%s' 'https://www.tiktok.com/@a/video/1' > fuzz/corpus/media_url/tiktok-url
            printf '%s' 'http://0x7f.1/' > fuzz/corpus/media_url/short-host
            printf '%s' 'http://[::ffff:127.0.0.1]/' > fuzz/corpus/media_url/mapped-v4
            printf '%s' 'https://youtu.be/abc' > fuzz/corpus/media_url/youtu-be
          fi
      # fuzz/ is its own workspace excluded from the root one; cargo-fuzz
      # finds it from the repo root. The repo rust-toolchain.toml pins
      # stable: RUSTUP_TOOLCHAIN overrides that file pin for this step
      # only, because cargo-fuzz passes -Zsanitizer=address (nightly
      # only). The gnu target is forced because the prebuilt cargo-fuzz
      # binary is a static musl binary whose default target is musl:
      # building for musl would try to link the glibc fontconfig and
      # cross-compile ring's C code, neither of which works on the
      # runner. Do not "simplify" this back to the default target.
      - name: Fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=45
        env:
          RUSTUP_TOOLCHAIN: nightly
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

  # A red nightly is not a merge gate: this job is advisory. It fails when a
  # mutation score drops below the baseline, and deliberately when a scope is
  # still provisional (after uploading its report) instead of passing unmeasured.
  # No scope is provisional today. The three Q-T4 scopes were first measured on
  # ubuntu-latest with the command below (run 45234358272: 57/81/79); after the
  # kill-or-justify round they were remeasured locally on Windows on 2026-11-24
  # (97/100/100), and those scores are recorded in scripts/mutants-baseline.json.
  # The next nightly must confirm them on ubuntu-latest. The provisional escape
  # hatch stays for a scope added before its first measured run.
  # One matrix leg per scope keeps each runner under the 60-minute timeout (the
  # monolithic job was already close to it with 3 scopes) and keeps ci-gate's
  # 55-minute budget reachable on pull_request.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Measured scopes: run on pull_request too (this workflow is in the
          # PR's changed paths), each leg compares against its baseline.
          - scope: lc-protocol
            package: lc-protocol
            file: ''
            filter: ''
            provisional: false
          - scope: lc-media-guard
            package: lc-media
            file: crates/lc-media/src/guard.rs
            filter: 'kind(lib) | binary(ssrf_guard) | binary(properties)'
            provisional: false
          - scope: lc-db-queue
            package: lc-db
            file: crates/lc-db/src/repos/playback_jobs.rs
            filter: ''
            provisional: false
          # Q-T4: representative critical files beyond the original three,
          # first measured on ubuntu-latest with the same command as the legs
          # above (run 45234358272, 2026-11-23): lc-playback-payload 57,
          # lc-db-core 81, lc-media-storage 79. Remeasured locally on Windows
          # after the kill-or-justify round (2026-11-24): 97, 100 and 100, the
          # scores now recorded in the baseline; the next nightly confirms them
          # on ubuntu-latest. The `provisional` flag and the
          # `status: "provisional"` escape hatch stay for a scope added before
          # its first measured run (skipped on pull_request, explicit failure on
          # the nightly after uploading its report).
          - scope: lc-playback-payload
            package: lc-playback
            file: crates/lc-playback/src/payload.rs
            filter: 'kind(lib) | binary(engine_scenarios)'
            provisional: false
          - scope: lc-db-core
            package: lc-db
            file: crates/lc-db/src/db.rs
            filter: ''
            provisional: false
          - scope: lc-media-storage
            package: lc-media
            file: crates/lc-media/src/storage.rs
            filter: 'kind(lib) | binary(properties)'
            provisional: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # lc-media depends on parley (Cargo.toml) whose yeslogic-fontconfig-sys
      # build script needs the system fontconfig headers on Linux; only the
      # lc-media legs need it.
      - name: Install Linux fontconfig
        if: matrix.package == 'lc-media'
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Pin the exact tool versions the baselines were measured with
      # (scripts/mutants-baseline.json, cargo-mutants 27.1.0 on Windows).
      # A drifting version could move min_mutants and the scores without
      # any code regression.
      - name: Install cargo-mutants and nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-mutants@27.1.0,nextest@0.9.151
      # cargo-mutants does not create the output parent directory itself.
      - name: Run the ${{ matrix.scope }} mutation scope
        # Provisional scopes have no score to compare yet. Running them on a
        # PR would either fail without a baseline (blocking ci-gate) or pass
        # without measuring anything; they first run on the nightly schedule,
        # which uploads outcomes.json and fails until the score is recorded.
        if: github.event_name != 'pull_request' || matrix.provisional != true
        env:
          SCOPE: ${{ matrix.scope }}
          PACKAGE: ${{ matrix.package }}
          MUTATION_FILE: ${{ matrix.file }}
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          # rust-cache can restore stale outcomes from target/mutants: every
          # mutation run starts from a clean slate for its scope.
          set -euo pipefail
          FAILED=0
          output="target/mutants/$SCOPE"
          rm -rf "$output"
          mkdir -p "$output"
          args=(cargo mutants --output "$output" -p "$PACKAGE")
          if [ -n "$MUTATION_FILE" ]; then
            args+=(--file "$MUTATION_FILE")
          fi
          args+=(--test-tool nextest -j 2)
          if [ -n "$TEST_FILTER" ]; then
            args+=(-- -E "$TEST_FILTER")
          fi
          # 0 = all mutants caught; 2 = FoundProblems (missed mutants). Both
          # proceed to the score comparison. Any other exit code is a broken
          # run (1 usage, 3 timeout, 4 baseline failed, 5/6 filter diff, 70
          # internal): outcomes.json is written incrementally, so a partial
          # file must never score as a green run.
          set +e
          "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::cargo mutants for $SCOPE exited $rc (expected 0 or 2)"
            FAILED=1
          fi
          # A scope that produced nothing must fail the job instead of
          # silently passing with an empty score.
          scope="$SCOPE"
          outcomes="target/mutants/$scope/mutants.out/outcomes.json"
          if [ ! -f "$outcomes" ]; then
            echo "::error::$scope produced no outcomes.json (run interrupted?)"
            exit 1
          fi
          # cargo-mutants 27.1.0 summary values are Success, CaughtMutant,
          # MissedMutant, Timeout, Unviable, Failure. Timeout outcomes count
          # as missed in the denominator; Failure is an unclassified broken
          # run and fails the job below.
          actual=$(jq -r '[.outcomes[].summary] | (map(select(. == "CaughtMutant")) | length) as $c | (map(select(. == "MissedMutant")) | length) as $m | (map(select(. == "Timeout")) | length) as $t | (if ($c + $m + $t) > 0 then ((100 * $c) / ($c + $m + $t) | floor) else 0 end)' "$outcomes")
          total=$(jq -r '.outcomes | length' "$outcomes")
          failures=$(jq -r '[.outcomes[].summary] | map(select(. == "Failure")) | length' "$outcomes")
          status=$(jq -r --arg s "$scope" '.[$s].status // "measured"' scripts/mutants-baseline.json)
          if [ "$status" = "provisional" ]; then
            echo "::error::$scope baseline is provisional (caught_pct=$actual, mutants=$total): no measured score yet; read target/mutants/$scope/mutants.out/outcomes.json (artifact mutants-report-$scope), then set caught_pct and status=measured in scripts/mutants-baseline.json and provisional=false in the matrix"
            FAILED=1
            exit "$FAILED"
          fi
          if [ "$status" != "measured" ]; then
            echo "::error::$scope baseline status '$status' is not 'measured' or 'provisional'"
            FAILED=1
            exit "$FAILED"
          fi
          baseline=$(jq -r --arg s "$scope" '.[$s].caught_pct' scripts/mutants-baseline.json)
          min_mutants=$(jq -r --arg s "$scope" '.[$s].min_mutants' scripts/mutants-baseline.json)
          # A missing baseline key makes jq print "null"; comparing it would
          # error out and silently pass. Require plain integers.
          for value in "$actual" "$baseline" "$min_mutants" "$total" "$failures"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::$scope produced a non-integer value where a number was expected: '$value'"
              FAILED=1
              exit "$FAILED"
            fi
          done
          echo "$scope: caught_pct=$actual, baseline=$baseline, mutants=$total"
          # cargo-mutants does NOT change its exit code for Failure outcomes
          # (outcome.rs exit_code() looks only at baseline, timeout and
          # missed): this check is the only guard against unclassified broken
          # runs passing as green.
          if [ "$failures" -gt 0 ]; then
            echo "::error::$scope recorded $failures unclassified Failure outcome(s)"
            FAILED=1
          fi
          if [ "$total" -lt "$min_mutants" ]; then
            echo "::error::$scope measured only $total mutants (expected at least $min_mutants)"
            FAILED=1
          fi
          if [ "$actual" -lt "$baseline" ]; then
            echo "::error::$scope mutation score $actual dropped below the baseline $baseline"
            FAILED=1
          fi
          exit "$FAILED"
      - name: Upload the ${{ matrix.scope }} mutation report
        if: always() && (github.event_name != 'pull_request' || matrix.provisional != true)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-report-${{ matrix.scope }}
          path: target/mutants/${{ matrix.scope }}/mutants.out
          if-no-files-found: warn

  # WebSocket load harness: boots a real lc-server against a fresh seeded
  # database, drives 50 overlay clients plus an ingest poster for 60 s, and
  # fails when any latency/socket/ingest budget fails. The board/media/trigger
  # budgets probe a separate seeded guild (200 READY assets and board items).
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # lc-media depends on parley (Cargo.toml) whose yeslogic-fontconfig-sys
      # build script needs the system fontconfig headers on Linux; building
      # the whole lc-server pulls lc-media in.
      - name: Install Linux fontconfig
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The loadtest only exercises the WebSocket, ingest, board and signed
      # media paths: skip the admin web UI build.
      - name: Build lc-server
        run: cargo build -p lc-server --release --locked
        env:
          LC_ADMIN_WEB_BUILD: "0"
      - name: Run the WebSocket load harness
        run: |
          cargo run -p xtask --release --locked -- loadtest \
            --server-bin target/release/lc-server \
            --clients 50 --duration-secs 60 \
            --board-items 200 --max-board-p95-ms 250 \
            --max-media-p95-ms 250 \
            --media-trigger-rate 10 --max-media-trigger-p95-ms 250 \
            --report target/load-report.json
      - name: Upload load report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: load-report
          path: target/load-report.json

  # The `#[ignore]` tests need ffmpeg, yt-dlp or the real network, so the PR
  # `test` job cannot run them. This job runs them on the nightly schedule and
  # on manual dispatch only: the workflow-level `pull_request` trigger exists
  # to check this file and the fuzz paths, and these tests must never gate a PR.
  ignored:
    name: ignored tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LC_ADMIN_WEB_BUILD: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # lc-media depends on parley (Cargo.toml) whose yeslogic-fontconfig-sys
      # build script needs the system fontconfig headers on Linux; lc-server
      # pulls lc-media in.
      - name: Install Linux fontconfig
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev
      # Many ignored tests shell out to the real binaries instead of linking
      # them: ffmpeg/ffprobe for the media tests, yt-dlp for the downloads.
      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends ffmpeg yt-dlp
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Same pinned nextest as the mutants job, so the listing format and the
      # filters used below cannot drift with a nextest upgrade.
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: nextest@0.9.151
      # Measure the ignored tests before running them. The counts are read from
      # nextest instead of hardcoded: the 2026-11-21 audit (31 lc-media /
      # 7 lc-server / 2 xtask) predates the cover and poster tests added on
      # 2026-11-22, and a renamed target must show up in the report rather than
      # silently shrink the nightly suite.
      - name: Report the ignored tests per crate
        run: |
          set -euo pipefail
          mkdir -p target
          cargo nextest list -p lc-media -p lc-server -p xtask \
            --all-features --locked --run-ignored only \
            --message-format json > target/ignored-tests.json
          jq -r '
            .["rust-suites"][]
            | .["package-name"] as $crate
            | .testcases
            | to_entries[]
            | select(.value.ignored)
            | "\($crate)::\(.key)"
          ' target/ignored-tests.json | sort > target/ignored-tests.txt
          network=$(jq -r '[.tests[] | select(.category == "network")] | length' scripts/release/ignored-nightly-tests.json)
          {
            echo '### Ignored tests (nightly)'
            echo
            echo '| crate | ignored tests |'
            echo '| --- | ---: |'
            total=0
            for crate in lc-media lc-server xtask; do
              count=$(grep -c "^${crate}::" target/ignored-tests.txt || true)
              echo "| $crate | $count |"
              total=$((total + count))
            done
            if [ "${{ inputs.network_tests }}" = "true" ]; then
              run_label="run in this job (network included)"
              run_count=$total
            else
              run_label="run without network"
              run_count=$((total - network))
            fi
            echo "| **total** | **$total** |"
            echo "| of which network (manual dispatch) | $network |"
            echo "| **$run_label** | **$run_count** |"
            echo
            echo '```'
            cat target/ignored-tests.txt
            echo '```'
          } | tee target/ignored-tests.md >> "$GITHUB_STEP_SUMMARY"
      # The automatic run covers the ignored tests that do not depend on a
      # third party service or real credentials. `network` tests stay in the
      # inventory and in the report above; they only run when a human dispatches
      # this workflow with `network_tests=true` (or with the documented local
      # command). The filter is derived from the manifest so a new network test
      # cannot be forgotten.
      - name: Select the ignored tests to run
        run: |
          if [ "${{ inputs.network_tests }}" = "true" ]; then
            filter='all()'
          else
            filter="not ($(jq -r '.network_filter' scripts/release/ignored-nightly-tests.json))"
          fi
          echo "NEXTEST_FILTER=$filter" >> "$GITHUB_ENV"
      # Keep going after a failure so one failing test does not hide the state
      # of the other two crates; the step still fails at the end.
      - name: Run the ignored tests
        run: |
          cargo nextest run -p lc-media -p lc-server -p xtask \
            --all-features --locked --run-ignored only --no-fail-fast \
            -E "$NEXTEST_FILTER"
      - name: Upload the ignored test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ignored-tests-report
          path: |
            target/ignored-tests.json
            target/ignored-tests.md
            target/ignored-tests.txt
          if-no-files-found: error
