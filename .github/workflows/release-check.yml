name: release-check

# Every released component (server, overlay, extension) must carry one version
# in all its files, the release tooling's own tests must pass under pwsh 7 (the
# tooling also runs under Windows PowerShell 5.1 on the maintainer's box), and
# the Bombadil runners' tests must pass (tools/bombadil/*.test.mjs): the static
# server answers 404 where a vanished file used to kill its node process, and
# the exploration options follow BOMBADIL_WIDTH / BOMBADIL_HEIGHT.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: versions & release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # Le gate tourne depuis la branche de base (script de confiance) ; ce
      # step teste la version du head, pour qu'une PR qui modifie le gate ou
      # ses tests soit vérifiée dans sa propre PR.
      - name: Test the CI gate
        run: node --test scripts/ci/tests/*.test.mjs

      - name: Test the Bombadil runners
        working-directory: tools/bombadil
        run: node --test

      - name: Check version consistency
        run: pwsh -NoProfile -File scripts/release.ps1 check

      - name: Test the release tooling
        run: pwsh -NoProfile -File scripts/release/tests/run-tests.ps1
