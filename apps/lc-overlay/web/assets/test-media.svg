<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Média de test LiveChat</title>
  <desc id="description">Carte de test locale sur fond sombre avec un cadre et le texte Média de test.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1d2638" />
      <stop offset="62%" stop-color="#111722" />
      <stop offset="100%" stop-color="#070a10" />
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#background)" />
  <circle cx="1120" cy="140" r="210" fill="#38bdf8" opacity="0.08" />
  <circle cx="160" cy="620" r="260" fill="#8b5cf6" opacity="0.1" />

  <rect x="140" y="100" width="1000" height="520" rx="28" fill="#0c111b" stroke="url(#frame)" stroke-width="4" />
  <rect x="166" y="126" width="948" height="468" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <g transform="translate(640 320)" text-anchor="middle">
    <text x="0" y="-106" fill="#38bdf8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="8">LIVECHAT</text>
    <text x="0" y="-10" fill="#ffffff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="88" font-weight="800">Média de test</text>
    <text x="0" y="66" fill="#cbd5e1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="500">Aperçu local de l’overlay</text>
  </g>

  <g transform="translate(640 552)" text-anchor="middle">
    <rect x="-124" y="-20" width="248" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" />
    <text x="0" y="6" fill="#94a3b8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">TEST MEDIA</text>
  </g>

  <path d="M190 160h40M190 160v40M1090 160h-40M1090 160v40M190 560h40M190 560v-40M1090 560h-40M1090 560v-40" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
</svg>
