name: bombadil-nightly

# Long Bombadil explorations (tools/bombadil), off the PR path: the rust
# workflow already runs 3 minutes per target on every change. Here each target
# runs for longer, the board in every mock state — the nightly modes, the states
# no spec action can reach (`?settings`, `?update=…`, `?nozone`, …) and two
# other viewport sizes — and the soak specs add resource-leak properties that
# only make sense over long runs. Traces are uploaded on failure only: a long
# run writes hundreds of MB of screenshots.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Exploration time per target, in minutes
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: bombadil-nightly
  cancel-in-progress: true

env:
  BOMBADIL_NO_SANDBOX: "1"

jobs:
  board:
    name: board (${{ matrix.mode.name }})
    runs-on: ubuntu-latest
    # 20 min per board target, plus npm ci and the typecheck.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The modes of the previous nightly: the same page, four different
          # starts (role, empty guild, pending removal).
          - mode: { name: admin, query: "media" }
          - mode: { name: member, query: "role=member&media" }
          - mode: { name: guest, query: "role=guest&media" }
          - mode: { name: empty, query: "empty" }
          - mode: { name: removed, query: "removed&media" }
          # States no spec action reaches: their screen only opens at startup
          # (see apps/lc-overlay/dev/board-mock.js). Ten minutes each: they are
          # single screens, the soak thresholds need only two.
          - mode: { name: settings, query: "settings&media", minutes: 10 }
          - mode: { name: update-ready, query: "update=ready&media", minutes: 10 }
          - mode: { name: update-downloading, query: "update=downloading&media", minutes: 10 }
          - mode: { name: nozone, query: "nozone&media", minutes: 10 }
          - mode: { name: member-empty, query: "role=member&empty", minutes: 10 }
          - mode: { name: guest-removed, query: "role=guest&removed&media", minutes: 10 }
          # Other viewports: with a single 1280 × 800 size, a control pushed out
          # of view or a layout that only breaks at 1024 px is never seen.
          - mode: { name: widescreen, query: "media", width: 1920, height: 1080, minutes: 10 }
          - mode: { name: compact, query: "media", width: 1024, height: 768, minutes: 10 }
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/bombadil/package-lock.json
      - name: Bombadil dependencies
        working-directory: tools/bombadil
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Explore the board
        working-directory: tools/bombadil
        env:
          LC_BOMBADIL_BOARD_QUERY: ${{ matrix.mode.query }}
          BOMBADIL_SPEC: specs/board-soak.ts
          BOMBADIL_WIDTH: ${{ matrix.mode.width || 1280 }}
          BOMBADIL_HEIGHT: ${{ matrix.mode.height || 800 }}
          BOMBADIL_TIME_LIMIT: ${{ matrix.mode.minutes || github.event.inputs.minutes || '20' }}m
        run: npm run board
      - name: Upload the trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bombadil-board-${{ matrix.mode.name }}
          path: tools/bombadil/out/
          if-no-files-found: ignore
          retention-days: 7

  admin:
    name: admin console
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Le build à froid de lc-server tire `fontique` → `yeslogic-fontconfig-sys`,
      # qui exige pkg-config + fontconfig, absents de l'image ubuntu-latest : sans
      # ces paquets la compilation s'arrête sur `Package 'fontconfig' was not
      # found`. Même liste que le job `test` de rust.yml, qui construit le binaire.
      - name: Linux system dependencies (Tauri)
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/lc-admin-web/package-lock.json
            tools/bombadil/package-lock.json
      # `rust-embed` embeds apps/lc-admin-web/dist at compile time.
      - name: Build the admin console
        working-directory: apps/lc-admin-web
        run: |
          npm ci
          npm run build
      - name: Build lc-server
        env:
          LC_ADMIN_WEB_BUILD: "0"
        run: cargo build -p lc-server --bin lc-server --locked
      - name: Bombadil dependencies
        working-directory: tools/bombadil
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Explore the admin console
        working-directory: tools/bombadil
        env:
          LC_SERVER_BIN: ${{ github.workspace }}/target/debug/lc-server
          BOMBADIL_SPEC: specs/admin-console-soak.ts
          BOMBADIL_TIME_LIMIT: ${{ github.event.inputs.minutes || '20' }}m
        run: npm run admin
      - name: Upload the trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bombadil-admin
          path: tools/bombadil/out/
          if-no-files-found: ignore
          retention-days: 7
