name: Extension Build and Release

on:
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
    tags:
      - "extension-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          manifest="$(jq -r .version public/manifest.json)"
          tag="${GITHUB_REF_NAME#extension-v}"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag extension-v$tag does not match public/manifest.json version $manifest"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run ci:check

      - name: Package extension zip
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livechat-extension-package
          path: extension/release/*.zip
          if-no-files-found: error

  # Extension releases never take the repository "Latest" flag: it belongs to
  # the overlay stable releases, whose latest.json the Tauri updater reads.
  # The extension is not on the Chrome Web Store for now: a release is the
  # GitHub release with the zip.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: livechat-extension-package
          path: release

      # Release title "LiveChat Extension X.Y.Z": the version without the tag prefix.
      - name: Read version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: echo "value=${GITHUB_REF_NAME#extension-v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (version tag)
        if: startsWith(github.ref, 'refs/tags/extension-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: LiveChat Extension ${{ steps.version.outputs.value }}
          make_latest: false
          files: release/*.zip
          generate_release_notes: true

      - name: Create/Update GitHub Release (latest build)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: extension-latest
          name: LiveChat Extension (latest)
          prerelease: true
          make_latest: false
          files: release/*.zip
          generate_release_notes: false
          append_body: false
          body: |
            Automatic latest extension build from `main`.
