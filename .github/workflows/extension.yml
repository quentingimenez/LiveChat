name: Extension Build and Release

on:
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
    tags:
      - "extension-v*"
  workflow_dispatch:
    inputs:
      publish_to_webstore:
        description: "Publier ce build sur le Chrome Web Store"
        type: boolean
        default: false
      publish_to_amo:
        description: "Publier ce build sur addons.mozilla.org"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          manifest="$(jq -r .version package.json)"
          tag="${GITHUB_REF_NAME#extension-v}"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag extension-v$tag does not match extension/package.json version $manifest"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run ci:check

      - name: Package extension zip
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livechat-extension-package
          path: extension/release/*.zip
          if-no-files-found: error

  # Extension releases never take the repository "Latest" flag: it belongs to
  # the overlay stable releases, whose latest.json the Tauri updater reads.
  # A tag also publishes the build to the Chrome Web Store (job below), which
  # is what updates the installed extensions.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: livechat-extension-package
          path: release

      # Release title "LiveChat Extension X.Y.Z": the version without the tag prefix.
      - name: Read version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: echo "value=${GITHUB_REF_NAME#extension-v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (version tag)
        if: startsWith(github.ref, 'refs/tags/extension-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: LiveChat Extension ${{ steps.version.outputs.value }}
          make_latest: false
          files: release/*.zip
          # The French "Changements depuis X.Y.Z" section is added by the
          # release process (.claude/skills/release); GitHub's generated notes
          # list every PR of the monorepo, in English.
          body: |
            Extension navigateur LiveChat (Chrome / Edge / Firefox).

            - Chrome / Edge : décompresser `livechat-extension-chromium-v${{ steps.version.outputs.value }}.zip`, ouvrir `chrome://extensions`, activer le mode développeur, puis « Charger l'extension non empaquetée » sur le dossier.
            - Firefox : la version listée sur addons.mozilla.org se met à jour toute seule. Pour tester ce build, ouvrir `about:debugging#/runtime/this-firefox`, puis « Charger un module temporaire » sur `manifest.json` du zip `livechat-extension-firefox-v${{ steps.version.outputs.value }}.zip`.
            - Configuration : dans les options de l'extension, l'URL du serveur et le code donné par l'overlay (Mon profil → Appairer l'extension navigateur) ou par `/pair-code` sur Discord.
            - Mise à jour : Chrome Web Store pour Chromium, addons.mozilla.org pour Firefox.

      - name: Create/Update GitHub Release (latest build)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: extension-latest
          name: LiveChat Extension (latest)
          prerelease: true
          make_latest: false
          files: release/*.zip
          generate_release_notes: false
          append_body: false
          body: |
            Automatic latest extension build from `main`.

  # Chrome Web Store (API v2): upload the package, then submit it for review.
  # The listing itself (logo, screenshots, texts, privacy) is edited by hand in
  # the developer dashboard, see docs/store/README.md.
  # Runs on an `extension-v*` tag, or on a manual run with `publish_to_webstore`.
  publish-webstore:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/extension-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_webstore)
    env:
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_API: https://chromewebstore.googleapis.com

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for var in CWS_PUBLISHER_ID CWS_EXTENSION_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::missing repository secret: $var (see docs/store/README.md)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: livechat-extension-package
          path: release

      - name: Resolve package path
        run: |
          set -euo pipefail
          zip_path="$(ls -1 release/*chromium*.zip | head -n 1)"
          [ -n "$zip_path" ] || { echo "::error::no chromium zip found in release/"; exit 1; }
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo "Package: $zip_path"

      - name: Get an OAuth access token
        run: |
          set -euo pipefail
          token_response="$(curl -sS -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${CWS_CLIENT_ID}" \
            -d "client_secret=${CWS_CLIENT_SECRET}" \
            -d "refresh_token=${CWS_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")"
          access_token="$(echo "$token_response" | jq -r '.access_token // empty')"
          if [ -z "$access_token" ]; then
            echo "::error::OAuth token exchange failed"
            echo "$token_response"
            exit 1
          fi
          echo "::add-mask::$access_token"
          echo "CWS_ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"

      - name: Upload the package
        id: upload
        run: |
          set -euo pipefail
          url="${CWS_API}/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:upload?uploadType=media"
          upload_response="$(curl -sS -X POST \
            -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${ZIP_PATH}" \
            "$url")"
          echo "$upload_response" | jq -r '"upload: \(.uploadState // "?") — version \(.crxVersion // "?")"'
          upload_state="$(echo "$upload_response" | jq -r '.uploadState // empty')"
          echo "upload_state=${upload_state}" >> "$GITHUB_OUTPUT"
          case "$upload_state" in
            SUCCEEDED | IN_PROGRESS) ;;
            *)
              echo "::error::Chrome Web Store upload failed"
              echo "$upload_response"
              exit 1
              ;;
          esac

      # The upload call reports SUCCEEDED for a processed package, so this wait
      # normally does not run. It only polls while the API says the package is
      # still being processed asynchronously.
      - name: Wait for the upload to be processed
        if: steps.upload.outputs.upload_state == 'IN_PROGRESS'
        run: |
          set -euo pipefail
          url="${CWS_API}/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus"
          for _ in $(seq 1 30); do
            status_response="$(curl -sS -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}" "$url")"
            # An empty state means the item has no pending asynchronous upload,
            # which says nothing about the package we just sent.
            upload_state="$(echo "$status_response" | jq -r '.lastAsyncUploadState // empty')"
            case "$upload_state" in
              SUCCEEDED)
                echo "upload processed"
                exit 0
                ;;
              FAILED | NOT_FOUND)
                echo "::error::the uploaded package was rejected"
                echo "$status_response"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::warning::the upload state is still unknown after 5 minutes, trying to publish anyway"

      - name: Submit the new version for review
        run: |
          set -euo pipefail
          url="${CWS_API}/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:publish"
          publish_response="$(curl -sS -X POST \
            -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "$url")"
          echo "$publish_response" | jq -r '"submission: \(.state // "?") — item \(.itemId // "?")"'
          state="$(echo "$publish_response" | jq -r '.state // empty')"
          case "$state" in
            PENDING_REVIEW | STAGED | PUBLISHED | PUBLISHED_TO_TESTERS)
              echo "Submission accepted: the review can take a few hours."
              ;;
            *)
              echo "::error::Chrome Web Store submission failed"
              echo "$publish_response"
              exit 1
              ;;
          esac
          warning_info="$(echo "$publish_response" | jq -c '.warningInfo // empty')"
          [ -z "$warning_info" ] || echo "::warning::Chrome Web Store warnings: $warning_info"

  # addons.mozilla.org (AMO): sign and submit the Firefox package as a listed
  # version. Firefox updates listed add-ons from AMO automatically; update_url
  # is both unnecessary and forbidden for Mozilla-hosted add-ons.
  # Paused until the AMO_JWT_ISSUER / AMO_JWT_SECRET secrets exist: the
  # repository variable AMO_PUBLISH gates the submission, so a tag never tries
  # to sign without credentials. Set it to "true" once the secrets are in place
  # (see docs/store/amo.md).
  publish-amo:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      vars.AMO_PUBLISH == 'true' &&
      (startsWith(github.ref, 'refs/tags/extension-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_amo))

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install the pinned AMO signing tool
        working-directory: tools/amo-sign
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: livechat-extension-package
          path: extension/release

      - name: Unpack the Firefox package
        working-directory: extension
        run: |
          set -euo pipefail
          zip_path="$(ls -1 release/*firefox*.zip | head -n 1)"
          [ -n "$zip_path" ] || { echo "::error::no firefox zip found in release/"; exit 1; }
          rm -rf firefox-build
          unzip -q "$zip_path" -d firefox-build

      # The secrets are scoped to this step only: checkout, npm ci and the
      # unpack step above never see them. web-ext reads the credentials from
      # WEB_EXT_API_KEY / WEB_EXT_API_SECRET, so they do not appear in argv.
      - name: Submit the new version to AMO
        working-directory: extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for var in WEB_EXT_API_KEY WEB_EXT_API_SECRET; do
            if [ -z "${!var:-}" ]; then
              echo "::error::missing repository secret for $var (see docs/store/amo.md)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          ../tools/amo-sign/node_modules/.bin/web-ext sign \
            --source-dir firefox-build \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0 \
            --timeout 900000 \
            --artifacts-dir amo-artifacts
          echo "Submitted to AMO: the review can take a few hours, Firefox then updates listed installations automatically."
