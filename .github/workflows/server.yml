name: Server legacy (tests)

# Tests du serveur Node/Prisma 2.x conservé pour le rollback 2.0.1.
#
# Ce workflow NE PUBLIE PLUS d'image : l'image de production 3.0.0 du serveur
# Rust est publiée exclusivement par `server-image.yml`, propriétaire unique des
# tags `ghcr.io/<owner>/livechat-server` (audit A7-003). L'image legacy déjà
# publiée (2.0.1) reste disponible pour un rollback via `docs/rust/packaging.md`.
on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-legacy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (legacy Node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: server/package.json

      # Même majeure que l'image legacy (node:20-alpine) conservée pour le rollback.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm generate

      - name: Unit tests
        run: pnpm test
