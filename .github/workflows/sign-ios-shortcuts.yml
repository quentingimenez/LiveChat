name: Sign iOS shortcuts

on:
  push:
    paths:
      - "ios/*.shortcut"
      - ".github/workflows/sign-ios-shortcuts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign shortcuts
        run: |
          mkdir -p ios/signed
          shopt -s nullglob
          for f in ios/*.shortcut; do
            name="$(basename "$f" .shortcut)"
            shortcuts sign --mode anyone --input "$f" --output "ios/signed/${name}.shortcut"
            echo "signed: $f -> ios/signed/${name}.shortcut"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-ios-shortcuts
          path: ios/signed/
          if-no-files-found: error
